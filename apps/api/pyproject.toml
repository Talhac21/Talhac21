[project]
name = "rr-panel-api"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.31.0",
  "sqlalchemy>=2.0.35",
  "psycopg[binary]>=3.2.1",
  "pydantic-settings>=2.5.2",
  "cryptography>=43.0.1",
  "httpx>=0.27.2",
  "playwright>=1.49.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.3.3", "pytest-asyncio>=0.24.0", "ruff>=0.6.8"]

[tool.pytest.ini_options]
pythonpath = ["app"]
