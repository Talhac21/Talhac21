services:
  caddy:
    image: caddy:2.8
    ports:
      - "80:80"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

  web:
    build: ./apps/web
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    restart: unless-stopped

  api:
    build: ./apps/api
    env_file:
      - ./.env
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  worker:
    build: ./apps/worker
    env_file:
      - ./.env
    environment:
      - API_BASE_URL=http://api:8000
      - API_ADMIN_TOKEN=${API_ADMIN_TOKEN}
    depends_on:
      - api
      - db
    healthcheck:
      test: ["CMD", "python", "-c", "import os; print('worker alive')"]
      interval: 60s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - rr_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  rr_pg_data:
